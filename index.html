<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu điểm</title>
  <!-- Thư viện đọc file Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif;
           background: #eef3f8; color: #1f2a37; }
    .wrap { max-width: 520px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 14px; padding: 24px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin: 0 0 4px; color: #0b5cad; text-align: center; }
    .sub { text-align: center; color: #6b7280; margin: 0 0 20px; font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
    select, input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1;
            border-radius: 8px; outline: none; background: #fff; }
    select:focus, input:focus { border-color: #0b5cad; }
    select:disabled { background: #f1f5f9; }
    .tabs { display: flex; gap: 8px; }
    .tabs button { margin: 0; flex: 1; background: #f1f5f9; color: #1f2a37;
                   border: 1px solid #cbd5e1; font-weight: 600; }
    .tabs button.chon { background: #0b5cad; color: #fff; border-color: #0b5cad; }
    button { width: 100%; margin-top: 18px; padding: 12px 18px; font-size: 16px; border: 0;
             border-radius: 8px; background: #0b5cad; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .goiy { font-size: 13px; color: #6b7280; margin-top: 4px; }
    #kq { margin-top: 20px; }
    .loi { background: #fdecec; color: #b42318; padding: 12px; border-radius: 8px; }
    .info { margin-bottom: 12px; line-height: 1.6; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; }
    th { background: #f1f5f9; font-weight: 600; font-size: 14px; }
    td { font-size: 18px; font-weight: 600; }
    .tb { margin-top: 6px; text-align: center; font-size: 17px; }
    .tb b { color: #0b5cad; font-size: 22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>TRA CỨU ĐIỂM</h1>
      <p class="sub">Chọn bảng điểm, lớp, tên và nhập mật khẩu để xem điểm</p>
      <form id="f">
        <label>Bảng điểm</label>
        <div class="tabs" id="tabs"><span class="goiy">Đang tải dữ liệu...</span></div>

        <label for="lop">Lớp</label>
        <select id="lop" disabled><option value="">-- Chọn bảng điểm trước --</option></select>

        <label for="ten">Họ và tên</label>
        <select id="ten" disabled><option value="">-- Chọn lớp trước --</option></select>

        <label for="mk">Mật khẩu (ngày tháng năm sinh)</label>
        <input id="mk" type="password" inputmode="numeric" autocomplete="off" placeholder="VD: 05092013">
        <div class="goiy">Viết liền, không dấu: ngày (2 số) + tháng (2 số) + năm (4 số)</div>

        <button id="btn" type="submit" disabled>Xem điểm</button>
      </form>
      <div id="kq"></div>
    </div>
  </div>

<script>
  // ===== CẤU HÌNH =====
  var TEN_FILE = 'bangdiem.xlsx';   // tên file Excel trên GitHub (cùng thư mục với index.html)
  var OWNER = 'avphung', REPO = 'kiemtradiem';

  // Số cột TX hiển thị cho từng tab (theo tên tab). Tab không có trong danh sách: tự động.
  var SO_TX = { 'MSC': 2, 'HSC': 3 };

  // Bỏ dấu, bỏ ký tự đặc biệt, viết hoa: "Mã định danh Bộ GD&ĐT" -> "MADINHDANHBOGDDT"
  function chuanHoa(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[đĐ]/g, 'D').toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  // Nhận dạng các cột theo tiêu đề
  var KHOP = {
    ma:  function (h) { return h.indexOf('MADINHDANH') >= 0 || ['MAHS','MASOHS','MAHOCSINH','MASOHOCSINH','MSHS'].indexOf(h) >= 0; },
    lop: function (h) { return h === 'LOP'; },                // đúng cột "Lớp" (không lấy "Lớp học")
    ten: function (h) { return h.indexOf('HOVATEN') >= 0 || h.indexOf('HOTEN') >= 0; },
    ns:  function (h) { return h.indexOf('NGAYSINH') >= 0 || h.indexOf('NGAYTHANGNAMSINH') >= 0; },
    tx:  function (h) { return h === 'DDGTX' || h === 'TX' || h === 'DTX' || h === 'DIEMTX'; },
    gk:  function (h) { return h === 'GK' || /(DDG|DIEM|D)GK$/.test(h) || h.indexOf('GIUAKY') >= 0 || h.indexOf('GIUAHK') >= 0; },
    ck:  function (h) { return h === 'CK' || /(DDG|DIEM|D)CK$/.test(h) || h.indexOf('CUOIKY') >= 0 || h.indexOf('CUOIHK') >= 0; },
    tb:  function (h) { return h.indexOf('DTB') === 0; }
  };

  // Đổi ngày sinh (dạng ngày của Excel hoặc chữ "05/09/2013") thành các mật khẩu hợp lệ
  function matKhauHopLe(v) {
    var d, m, y;
    if (typeof v === 'number') {
      var dt = new Date(Math.round((v - 25569) * 86400000));
      d = dt.getUTCDate(); m = dt.getUTCMonth() + 1; y = dt.getUTCFullYear();
    } else {
      var p = String(v).match(/\d+/g);
      if (!p) return [];
      if (p.length === 1 && p[0].length === 8) return [p[0]];
      if (p.length < 3) return [];
      if (p[0].length === 4) { y = +p[0]; m = +p[1]; d = +p[2]; }
      else { d = +p[0]; m = +p[1]; y = +p[2]; if (y < 100) y += (y < 50 ? 2000 : 1900); }
    }
    var dd = ('0' + d).slice(-2), mm = ('0' + m).slice(-2);
    return [dd + mm + y, d + '' + m + y, dd + m + y, d + mm + y];   // chấp nhận 05092013 và 592013
  }

  function hienSo(v) {
    if (v === '' || v == null) return '';
    if (typeof v === 'number') return String(Math.round(v * 100) / 100).replace('.', ',');
    return String(v).trim();
  }
  function soDiem(s) {
    s = String(s || '').trim().replace(',', '.');
    if (s === '') return null;
    var n = Number(s);
    return isNaN(n) ? null : n;
  }

  // ===== ĐỌC 1 TRANG TÍNH =====
  function docBang(data) {
    var hRow = -1;
    for (var r = 0; r < Math.min(15, data.length); r++) {
      var h = data[r].map(chuanHoa);
      if (h.some(KHOP.lop) && h.some(KHOP.ten)) { hRow = r; break; }
    }
    if (hRow < 0) return null;

    var h1 = data[hRow] || [], h2 = data[hRow + 1] || [];
    var idx = {};
    for (var k in KHOP) {
      idx[k] = -1;
      [h1, h2].forEach(function (hr) {
        if (idx[k] >= 0) return;
        for (var c = 0; c < hr.length; c++) {
          if (KHOP[k](chuanHoa(hr[c]))) { idx[k] = c; break; }
        }
      });
    }

    // Cột TX: tiêu đề "ĐĐGtx" gộp ô, dòng dưới đánh số 1, 2, 3, 4, 5
    var txCols = [];
    if (idx.tx >= 0) {
      for (var c = idx.tx; c < idx.tx + 10; c++) {
        var so = chuanHoa(h2[c]);
        if (/^\d+$/.test(so)) txCols.push({ ten: 'TX' + so, cot: c });
        else if (c > idx.tx) break;
      }
      if (!txCols.length) txCols.push({ ten: 'TX', cot: idx.tx });
    } else {
      // Dự phòng: các cột tên TX1, TX2... riêng lẻ
      for (var c2 = 0; c2 < h1.length; c2++) {
        var m = chuanHoa(h1[c2]).match(/TX(\d)$/) || chuanHoa(h2[c2]).match(/TX(\d)$/);
        if (m) txCols.push({ ten: 'TX' + m[1], cot: c2 });
      }
    }

    var ds = [];
    for (var i = hRow + 1; i < data.length; i++) {
      var row = data[i];
      var lop = String(row[idx.lop] || '').trim();
      var ten = String(row[idx.ten] || '').trim();
      if (!lop || !ten) continue;
      var g = function (k) { return idx[k] >= 0 ? hienSo(row[idx[k]]) : ''; };
      ds.push({
        ma: g('ma'), lop: lop, ten: ten, ns: idx.ns >= 0 ? row[idx.ns] : '',
        tx: txCols.map(function (t) { return hienSo(row[t.cot]); }),
        gk: g('gk'), ck: g('ck'), tb: g('tb')
      });
    }

    // Chỉ hiện các cột TX đã có ít nhất 1 điểm trong bảng
    var txHien = [];
    txCols.forEach(function (t, j) {
      if (ds.some(function (hs) { return hs.tx[j] !== ''; })) txHien.push(j);
    });
    if (!txHien.length && txCols.length) txHien = [0];

    return { ds: ds, txCols: txCols, txHien: txHien };
  }

  // ===== GIAO DIỆN =====
  var bang = {};     // { 'MSC': {...}, 'HSC': {...} }
  var bangChon = null;
  var tabsBox = document.getElementById('tabs'),
      selLop = document.getElementById('lop'), selTen = document.getElementById('ten'),
      inpMk = document.getElementById('mk'), btn = document.getElementById('btn'),
      kqBox = document.getElementById('kq');

  function themOption(sel, value, text) {
    var o = document.createElement('option');
    o.value = value; o.textContent = text; sel.appendChild(o);
  }

  function chonBang(ten) {
    bangChon = ten;
    Array.prototype.forEach.call(tabsBox.children, function (b) {
      b.className = (b.textContent === ten) ? 'chon' : '';
    });
    kqBox.innerHTML = '';
    var dsLop = [];
    bang[ten].ds.forEach(function (hs) { if (dsLop.indexOf(hs.lop) < 0) dsLop.push(hs.lop); });
    dsLop.sort(function (a, b) { return a.localeCompare(b, 'vi', { numeric: true }); });

    selLop.innerHTML = '';
    themOption(selLop, '', '-- Chọn lớp --');
    dsLop.forEach(function (l) { themOption(selLop, l, l); });
    selLop.disabled = false;
    selTen.innerHTML = '';
    themOption(selTen, '', '-- Chọn lớp trước --');
    selTen.disabled = true;
    btn.disabled = false;
  }

  // Lấy file mới nhất trực tiếp từ kho GitHub (cập nhật tức thì).
  // Nếu GitHub từ chối (quá nhiều lượt truy cập trong 1 giờ) thì lấy bản trên GitHub Pages.
  function taiFile() {
    var api = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + TEN_FILE +
              '?ref=main&t=' + Date.now();
    return fetch(api, { headers: { 'Accept': 'application/vnd.github.raw' }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw r.status; return r.arrayBuffer(); })
      .catch(function () {
        return fetch(TEN_FILE + '?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('Không tải được file ' + TEN_FILE);
            return r.arrayBuffer();
          });
      });
  }

  taiFile()
    .then(function (buf) {
      var wb = XLSX.read(buf, { type: 'array' });
      tabsBox.innerHTML = '';
      wb.SheetNames.forEach(function (tenTab) {
        var data = XLSX.utils.sheet_to_json(wb.Sheets[tenTab], { header: 1, raw: true, defval: '' });
        var kq = docBang(data);
        if (!kq || !kq.ds.length) return;           // bỏ qua tab không phải bảng điểm
        for (var key in SO_TX) {
          if (chuanHoa(tenTab).indexOf(chuanHoa(key)) >= 0) {
            kq.txHien = [];
            for (var j = 0; j < Math.min(SO_TX[key], kq.txCols.length); j++) kq.txHien.push(j);
            break;
          }
        }
        bang[tenTab] = kq;
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = tenTab;
        b.addEventListener('click', function () { chonBang(tenTab); });
        tabsBox.appendChild(b);
      });
      var ten = Object.keys(bang);
      if (!ten.length) throw new Error('Không tìm thấy bảng điểm có cột "Lớp" và "Họ và tên".');
      if (ten.length === 1) chonBang(ten[0]);
    })
    .catch(function (e) {
      tabsBox.innerHTML = '';
      hien({ loi: 'Chưa tải được bảng điểm. ' + e.message });
    });

  selLop.addEventListener('change', function () {
    selTen.innerHTML = '';
    kqBox.innerHTML = '';
    if (!selLop.value) {
      themOption(selTen, '', '-- Chọn lớp trước --');
      selTen.disabled = true; return;
    }
    themOption(selTen, '', '-- Chọn tên --');
    bang[bangChon].ds.forEach(function (hs, i) {
      if (hs.lop === selLop.value) themOption(selTen, i, hs.ten);
    });
    selTen.disabled = false;
  });

  // ===== HIỂN THỊ KẾT QUẢ =====
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  function bangDiem(cot) {
    var t = el('table'), r1 = el('tr'), r2 = el('tr');
    cot.forEach(function (c) {
      r1.appendChild(el('th', c[0]));
      r2.appendChild(el('td', c[1] === '' ? '–' : c[1]));
    });
    t.appendChild(r1); t.appendChild(r2);
    return t;
  }

  function hien(d, b) {
    kqBox.innerHTML = '';
    if (d.loi) { kqBox.appendChild(el('div', d.loi, 'loi')); return; }

    var info = el('div', null, 'info');
    info.appendChild(el('div', 'Họ tên: ' + d.ten));
    info.appendChild(el('div', 'Lớp: ' + d.lop));
    if (d.ma) info.appendChild(el('div', 'Mã định danh: ' + d.ma));
    kqBox.appendChild(info);

    var cotTx = b.txHien.map(function (j) { return [b.txCols[j].ten, d.tx[j]]; });
    kqBox.appendChild(bangDiem(cotTx.concat([['GK', d.gk], ['CK', d.ck]])));

    // Lấy ĐTB trong file; nếu file chưa có thì tự tính (Tổng TX + 2×GK + 3×CK) / (số TX + 5)
    var tbVal = d.tb;
    if (!tbVal) {
      var tx = d.tx.map(soDiem).filter(function (x) { return x !== null; });
      var gk = soDiem(d.gk), ck = soDiem(d.ck);
      if (tx.length > 0 && gk !== null && ck !== null) {
        var tong = tx.reduce(function (a, c) { return a + c; }, 0) + 2 * gk + 3 * ck;
        tbVal = (Math.round(tong / (tx.length + 5) * 10) / 10).toFixed(1).replace('.', ',');
      }
    }
    if (tbVal) {
      var tb = el('div', 'Điểm trung bình môn: ', 'tb');
      tb.appendChild(el('b', tbVal));
      kqBox.appendChild(tb);
    }
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!bangChon) return hien({ loi: 'Em hãy chọn bảng điểm.' });
    if (!selLop.value) return hien({ loi: 'Em hãy chọn lớp.' });
    if (selTen.value === '') return hien({ loi: 'Em hãy chọn họ tên.' });
    var mk = inpMk.value.replace(/\D/g, '');
    if (!mk) return hien({ loi: 'Em hãy nhập mật khẩu (ngày tháng năm sinh).' });

    var b = bang[bangChon];
    var hs = b.ds[+selTen.value];
    if (matKhauHopLe(hs.ns).indexOf(mk) < 0) {
      return hien({ loi: 'Mật khẩu không đúng. Nhập ngày sinh viết liền, VD: 05092013.' });
    }
    hien(hs, b);
  });
</script>
</body>
</html>
