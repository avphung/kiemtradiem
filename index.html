<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tra cứu điểm</title>
  <!-- Thư viện đọc file Excel -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif;
           background: #eef3f8; color: #1f2a37; }
    .wrap { max-width: 480px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 14px; padding: 24px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin: 0 0 4px; color: #0b5cad; text-align: center; }
    .sub { text-align: center; color: #6b7280; margin: 0 0 20px; font-size: 14px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1;
            border-radius: 8px; outline: none; min-width: 0; }
    input:focus { border-color: #0b5cad; }
    button { padding: 12px 18px; font-size: 16px; border: 0; border-radius: 8px;
             background: #0b5cad; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #kq { margin-top: 20px; }
    .loi { background: #fdecec; color: #b42318; padding: 12px; border-radius: 8px; }
    .info { margin-bottom: 12px; line-height: 1.6; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; }
    th { background: #f1f5f9; font-weight: 600; }
    td { font-size: 18px; font-weight: 600; }
    .tb { margin-top: 12px; text-align: center; font-size: 17px; }
    .tb b { color: #0b5cad; font-size: 22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>TRA CỨU ĐIỂM</h1>
      <p class="sub">Nhập mã số học sinh để xem điểm</p>
      <form id="f">
        <input id="ma" placeholder="Mã số học sinh" autocomplete="off" required>
        <button id="btn" type="submit">Xem điểm</button>
      </form>
      <div id="kq"></div>
    </div>
  </div>

<script>
  // ===== CẤU HÌNH =====
  var TEN_FILE = 'diem.xlsx';   // tên file Excel tải lên GitHub (cùng thư mục với index.html)

  // Các tên cột được chấp nhận (đã bỏ dấu, bỏ khoảng trắng, viết hoa)
  var COT = {
    ma:  ['MAHS', 'MASOHS', 'MAHOCSINH', 'MASOHOCSINH', 'MSHS', 'MASO', 'MADINHDANH'],
    ten: ['HOTEN', 'HOVATEN', 'TEN', 'HOTENHOCSINH'],
    lop: ['LOP'],
    tx1: ['TX1', 'DTX1'],
    tx2: ['TX2', 'DTX2'],
    tx3: ['TX3', 'DTX3'],
    gk:  ['GK', 'GIUAKY', 'DGK'],
    ck:  ['CK', 'CUOIKY', 'DCK']
  };

  function chuanHoa(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[đĐ]/g, 'D').toUpperCase().replace(/[^A-Z0-9]/g, '');
  }

  function soDiem(s) {
    s = String(s || '').trim().replace(',', '.');
    if (s === '') return null;
    var n = Number(s);
    return isNaN(n) ? null : n;
  }

  // Tải và đọc file Excel (chỉ tải 1 lần)
  var duLieu = null;
  function taiDuLieu() {
    if (duLieu) return Promise.resolve(duLieu);
    return fetch(TEN_FILE + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('Không tải được file ' + TEN_FILE);
        return r.arrayBuffer();
      })
      .then(function (buf) {
        var wb = XLSX.read(buf, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];   // trang tính đầu tiên
        duLieu = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
        return duLieu;
      });
  }

  function traCuu(data, maNhap) {
    var ma = chuanHoa(maNhap);
    if (!ma) return { loi: 'Vui lòng nhập mã số học sinh.' };

    var hRow = -1, idx = {};
    for (var r = 0; r < Math.min(10, data.length); r++) {
      var h = data[r].map(chuanHoa), m = {};
      for (var k in COT) {
        m[k] = h.findIndex(function (x) { return COT[k].indexOf(x) >= 0; });
      }
      if (m.ma >= 0) { hRow = r; idx = m; break; }
    }
    if (hRow < 0) return { loi: 'Không tìm thấy cột "Mã HS" trong bảng điểm. Vui lòng báo giáo viên.' };

    for (var i = hRow + 1; i < data.length; i++) {
      if (chuanHoa(data[i][idx.ma]) !== ma) continue;
      var row = data[i];
      var g = function (k) { return idx[k] >= 0 ? String(row[idx[k]]).trim() : ''; };
      var kq = { ma: g('ma'), ten: g('ten'), lop: g('lop'),
                 tx1: g('tx1'), tx2: g('tx2'), tx3: g('tx3'), gk: g('gk'), ck: g('ck'), tb: '' };

      // ĐTB môn học kì = (Tổng TX + 2×GK + 3×CK) / (số cột TX + 5)
      var tx = [kq.tx1, kq.tx2, kq.tx3].map(soDiem).filter(function (x) { return x !== null; });
      var gk = soDiem(kq.gk), ck = soDiem(kq.ck);
      if (tx.length > 0 && gk !== null && ck !== null) {
        var tong = tx.reduce(function (a, b) { return a + b; }, 0) + 2 * gk + 3 * ck;
        kq.tb = (Math.round(tong / (tx.length + 5) * 10) / 10).toFixed(1).replace('.', ',');
      }
      return kq;
    }
    return { loi: 'Không tìm thấy mã số học sinh "' + String(maNhap).trim() + '". Em kiểm tra lại nhé.' };
  }

  // ===== GIAO DIỆN =====
  var f = document.getElementById('f'), btn = document.getElementById('btn'),
      kqBox = document.getElementById('kq');

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  function hien(d) {
    btn.disabled = false; btn.textContent = 'Xem điểm';
    kqBox.innerHTML = '';
    if (d.loi) { kqBox.appendChild(el('div', d.loi, 'loi')); return; }

    var info = el('div', null, 'info');
    info.appendChild(el('div', 'Họ tên: ' + (d.ten || '')));
    info.appendChild(el('div', 'Lớp: ' + (d.lop || '') + '   –   Mã HS: ' + d.ma));
    kqBox.appendChild(info);

    var cot = [['TX1', d.tx1], ['TX2', d.tx2], ['TX3', d.tx3], ['GK', d.gk], ['CK', d.ck]];
    var t = el('table'), r1 = el('tr'), r2 = el('tr');
    cot.forEach(function (c) {
      r1.appendChild(el('th', c[0]));
      r2.appendChild(el('td', c[1] === '' ? '–' : c[1]));
    });
    t.appendChild(r1); t.appendChild(r2);
    kqBox.appendChild(t);

    if (d.tb) {
      var tb = el('div', 'Điểm trung bình môn: ', 'tb');
      tb.appendChild(el('b', d.tb));
      kqBox.appendChild(tb);
    }
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Đang tìm...';
    var ma = document.getElementById('ma').value;
    taiDuLieu()
      .then(function (data) { hien(traCuu(data, ma)); })
      .catch(function () { hien({ loi: 'Chưa tải được bảng điểm, em thử lại sau nhé.' }); });
  });
</script>
</body>
</html>
